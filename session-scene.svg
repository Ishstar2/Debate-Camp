<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none" role="img" aria-label="A private one-on-one online debate session on a laptop, with coach and student video tiles and a secure lock badge">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- laptop base -->
    <path d="M70 232 h340 l28 26 H42 z" fill="#E7DAC1" stroke="#33291E" stroke-width="3"/>
    <path d="M210 244 h60" stroke="#6E6353" stroke-width="3"/>
    <!-- screen -->
    <rect x="96" y="48" width="288" height="184" rx="10" fill="#33291E" stroke="#33291E" stroke-width="3"/>
    <rect x="108" y="60" width="264" height="160" rx="6" fill="#3F2F1E"/>

    <!-- coach tile -->
    <rect x="120" y="74" width="116" height="92" rx="6" fill="#5B4632" stroke="#B0772F" stroke-width="1.6"/>
    <circle cx="178" cy="116" r="20" fill="#EFE4CC"/>
    <path d="M158 150 a20 20 0 0 1 40 0 z" fill="#B0772F"/>
    <text x="178" y="186" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#EAD9B6">Coach</text>

    <!-- student tile -->
    <rect x="244" y="74" width="116" height="92" rx="6" fill="#5B4632" stroke="#B0772F" stroke-width="1.6"/>
    <circle cx="302" cy="116" r="20" fill="#EFE4CC"/>
    <path d="M282 150 a20 20 0 0 1 40 0 z" fill="#B0532F"/>
    <text x="302" y="186" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#EAD9B6">Student</text>

    <!-- speech spark between tiles -->
    <path d="M236 110 h8 M236 120 h8" stroke="#E7C98B" stroke-width="2.4"/>

    <!-- secure lock badge -->
    <g transform="translate(330 196)">
      <rect x="0" y="6" width="34" height="24" rx="5" fill="#B0772F" stroke="#33291E" stroke-width="2"/>
      <path d="M7 6 V2 a10 10 0 0 1 20 0 V6" stroke="#33291E" stroke-width="2.4"/>
      <circle cx="17" cy="18" r="3.2" fill="#33291E"/>
    </g>
  </g>
</svg>
