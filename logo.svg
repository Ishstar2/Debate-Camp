<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Vortex Speech &amp; Debate crest">
<defs><style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;display=swap');
.ring{fill:none;stroke:#1C1814;}
.gold{fill:none;stroke:#B68A3C;}
.rt{font-family:'Cinzel',serif;fill:#1C1814;letter-spacing:2px;}
.tg{font-family:'Cinzel',serif;fill:#B68A3C;letter-spacing:3px;}
</style></defs>

<!-- concentric rings -->
<circle class="ring" cx="100" cy="100" r="95" stroke-width="2.2"/>
<circle class="gold" cx="100" cy="100" r="88" stroke-width="1"/>
