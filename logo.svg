<!-- circular type -->
<path id="topArc" fill="none" d="M 31 100 A 69 69 0 0 1 169 100"/>
<path id="botArc" fill="none" d="M 33 100 A 67 67 0 0 0 167 100"/>
<text class="rt" font-size="12.5" font-weight="600"><textPath href="#topArc" startOffset="50%" text-anchor="middle">VORTEX SPEECH &amp; DEBATE</textPath></text>
<text class="tg" font-size="9" font-weight="500"><textPath href="#botArc" startOffset="50%" text-anchor="middle">FIND&#160;&#160;YOUR&#160;&#160;VOICE</textPath></text>

